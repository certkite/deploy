name: Build release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      CERTKITE_RELEASE_PUBLIC_KEY_HEX: ${{ vars.CERTKITE_RELEASE_PUBLIC_KEY_HEX }}
      CERTKITE_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@5445741acf05630efa19e221cc588ebe0842b13d
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Require release verification key
        shell: bash
        run: |
          [[ "$CERTKITE_RELEASE_PUBLIC_KEY_HEX" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "Configure the trusted Ed25519 public key repository variable" >&2; exit 1; }
      - name: Verify workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - run: cargo build --release --locked -p certkite-cli
      - name: Prepare platform artifact
        shell: bash
        run: |
          mkdir -p artifacts/${{ matrix.target }}
          asset=certkite-${{ matrix.target }}
          cp target/release/certkite artifacts/${{ matrix.target }}/$asset
          cd artifacts/${{ matrix.target }}
          sha256sum "$asset" > "$asset.sha256"
      - name: Embed installer verification key
        shell: bash
        run: |
          sed "s/RELEASE_PUBLIC_KEY_HEX=\"\"/RELEASE_PUBLIC_KEY_HEX=\"$CERTKITE_RELEASE_PUBLIC_KEY_HEX\"/" install.sh > artifacts/${{ matrix.target }}/install.sh
          sh -n artifacts/${{ matrix.target }}/install.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: certkite-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}/
          if-no-files-found: error
